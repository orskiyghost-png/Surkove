name: Build and publish static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surkove-deploy-branch
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production site
        run: npm run build

      - name: Validate production files
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { resolve, relative, sep } from 'node:path';

          const root = resolve('dist');
          const index = resolve(root, 'index.html');
          if (!statSync(root).isDirectory() || !statSync(index).isFile()) {
            throw new Error('dist/index.html is missing');
          }

          function walk(directory) {
            return readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const file = resolve(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Symlink is not allowed: ${file}`);
              return entry.isDirectory() ? walk(file) : [file];
            });
          }

          const files = walk(root);
          const assets = files.filter((file) => relative(root, file).startsWith(`assets${sep}`));
          const cssFiles = assets.filter((file) => file.endsWith('.css'));
          const jsFiles = assets.filter((file) => /\.m?js$/i.test(file));
          if (cssFiles.length === 0 || jsFiles.length === 0) {
            throw new Error('dist/assets must contain CSS and JavaScript');
          }

          const origin = 'https://surkove.invalid';
          function checkReference(raw, base = '/') {
            const value = raw.trim();
            if (!value || value.startsWith('#') || /^(data:|mailto:|tel:|javascript:|\/\/)/i.test(value)) return;
            const url = new URL(value, `${origin}${base}`);
            if (url.origin !== origin) return;
            const target = resolve(root, `.${decodeURIComponent(url.pathname)}`);
            const rel = relative(root, target);
            if (rel.startsWith(`..${sep}`) || rel === '..' || !statSync(target, { throwIfNoEntry: false })?.isFile()) {
              throw new Error(`Referenced static resource is missing: ${value}`);
            }
          }

          const html = readFileSync(index, 'utf8');
          const htmlRefs = [...html.matchAll(/\b(?:src|href)\s*=\s*(["'])(.*?)\1/gi)].map((match) => match[2]);
          for (const ref of htmlRefs) checkReference(ref);
          if (!htmlRefs.some((ref) => /\.css(?:[?#]|$)/i.test(ref)) || !htmlRefs.some((ref) => /\.m?js(?:[?#]|$)/i.test(ref))) {
            throw new Error('index.html must reference CSS and JavaScript bundles');
          }
          for (const cssFile of cssFiles) {
            const css = readFileSync(cssFile, 'utf8');
            for (const match of css.matchAll(/url\(\s*(["']?)(.*?)\1\s*\)/gi)) {
              checkReference(match[2], `/${relative(root, cssFile).split(sep).slice(0, -1).join('/')}/`);
            }
          }
          console.log(`Validated ${files.length} files, ${cssFiles.length} CSS bundles, and ${jsFiles.length} JavaScript bundles.`);
          NODE

      - name: Publish dist to deploy branch without rewriting history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT
          git -C "$deploy_dir" init --initial-branch=deploy
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code "$remote" refs/heads/deploy >/dev/null; then
            git -C "$deploy_dir" remote add origin "$remote"
            git -C "$deploy_dir" -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --depth=1 origin refs/heads/deploy:refs/remotes/origin/deploy
            git -C "$deploy_dir" checkout -B deploy refs/remotes/origin/deploy
          else
            git -C "$deploy_dir" remote add origin "$remote"
          fi
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" ls-files -z | xargs -0 -r git -C "$deploy_dir" rm -f
          cp -R dist/. "$deploy_dir/"
          git -C "$deploy_dir" add --all
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "deploy branch already contains this production artifact"
            exit 0
          fi
          git -C "$deploy_dir" commit -m "Publish ${source_sha}"
          git -C "$deploy_dir" -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/deploy
          unset auth
