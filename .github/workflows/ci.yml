name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install PHP CLI for hosting-panel syntax checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends php-cli

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in hosting/*.php; do
            php -l "$file"
          done

      - name: Type-check application
        run: npm run typecheck

      - name: Build production site
        run: npm run build

      - name: Verify production artifact and scan for secrets
        run: node .github/scripts/verify-artifact.mjs
